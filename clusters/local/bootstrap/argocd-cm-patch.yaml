# Merged into argocd-cm by scripts/bootstrap/local.sh. Upstream removed health
# assessment for Application resources in Argo CD 1.8; app-of-apps sync waves
# need it back, or wave N+1 starts before wave N's apps are Healthy.
# Source: Argo CD v3.5.5 docs, operator-manual/health.md, "Argocd App".
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
