# The local site: 3 nodes, no default CNI and no kube-proxy, because Cilium
# provides both. Only the control-plane carries the gateway label, so only it
# runs the host-network Envoy listeners; kind maps them 1:1 to the laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chronon
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
    labels:
      chronon.io/gateway: "true"
    extraPortMappings:
      - { containerPort: 8443, hostPort: 8443 } # Gateway HTTPS (unprivileged)
      - { containerPort: 8080, hostPort: 8080 } # Gateway HTTP (unprivileged)
  - role: worker
  - role: worker
