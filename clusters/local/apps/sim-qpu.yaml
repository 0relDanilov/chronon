apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sim-qpu
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: chronon
  source:
    repoURL: https://github.com/0relDanilov/chronon.git
    targetRevision: main
    path: backends/sim-qpu/base
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
