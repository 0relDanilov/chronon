# The local site's app-of-apps. Waves: -2 cert-manager; -1 CNPG operator and
# PKI (issuers + the Certificate); 0 Valkey, Argo Workflows, Gateway;
# 1 chronon services with their own HTTPRoutes; 2 backends.
# The Gateway must come before the routes: a route stays Progressing until a
# Gateway accepts it, so routes in an earlier wave deadlock the sync.
# Requires the Application health check that the bootstrap adds to argocd-cm,
# or the waves don't wait for each other.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
  - cnpg-operator.yaml
  - pki.yaml
  - valkey.yaml
  - argo-workflows.yaml
  - chronon.yaml
  - gateway.yaml
