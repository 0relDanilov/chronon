# chronon-api. For now it serves only /healthz (the rung-1 "hello" route).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronon-api
  labels: { app.kubernetes.io/name: chronon-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: chronon-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chronon-api }
    spec:
      containers:
        - name: api
          image: chronon:dev
          imagePullPolicy: IfNotPresent # loaded by `kind load`, never pulled
          command: [uvicorn, chronon.api.app:app, --host, 0.0.0.0, --port, "8000"]
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chronon-api
  labels: { app.kubernetes.io/name: chronon-api }
spec:
  selector: { app.kubernetes.io/name: chronon-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chronon-api
spec:
  parentRefs:
    - name: chronon
      namespace: gateway
      sectionName: https
  hostnames: [api.chronon.test]
  rules:
    - backendRefs:
        - { name: chronon-api, port: 80 }
