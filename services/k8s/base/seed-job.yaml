# Seeds summary and initial state datasets after every sync. Idempotent:
# it writes only what changed. Runs migrations first, like the services.
apiVersion: batch/v1
kind: Job
metadata:
  name: chronon-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: chronon-seed, app.kubernetes.io/part-of: chronon }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: chronon:dev
          imagePullPolicy: IfNotPresent
          command: [python, -m, chronon.seed]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: chronon-db-app, key: uri }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
