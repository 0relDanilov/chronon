# chronon-state: datasets, lineage and time series under /{backend}/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronon-state
  labels: { app.kubernetes.io/name: chronon-state, app.kubernetes.io/part-of: chronon }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: chronon-state }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chronon-state, app.kubernetes.io/part-of: chronon }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Every service migrates before it starts; an advisory lock in
        # chronon.db.migrate makes concurrent runs safe.
        - name: migrate
          image: chronon:dev
          imagePullPolicy: IfNotPresent
          command: [python, -m, chronon.migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: chronon-db-app, key: uri }
            - name: VALKEY_URL
              value: redis://valkey:6379/0
            - name: PROVIDER_KEYS_DIR
              value: /etc/chronon/provider-keys
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      containers:
        - name: app
          image: chronon:dev
          imagePullPolicy: IfNotPresent # loaded by `kind load`, never pulled
          command: [uvicorn, chronon.state.app:app, --host, 0.0.0.0, --port, "8000"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: chronon-db-app, key: uri }
            - name: VALKEY_URL
              value: redis://valkey:6379/0
            - name: PROVIDER_KEYS_DIR
              value: /etc/chronon/provider-keys
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: provider-keys, mountPath: /etc/chronon/provider-keys, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: provider-keys
          configMap: { name: provider-keys }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chronon-state
  labels: { app.kubernetes.io/name: chronon-state }
spec:
  selector: { app.kubernetes.io/name: chronon-state }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chronon-state
spec:
  parentRefs:
    - name: chronon
      namespace: gateway
      sectionName: https
  hostnames: [state.chronon.test]
  rules:
    - backendRefs:
        - { name: chronon-state, port: 80 }
