site_name: chronon
site_description: >-
  A staging slice of a time-shared quantum-datacenter platform
  (independent learning project).
repo_url: https://github.com/0relDanilov/chronon
edit_uri: ""
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Pages are added here only once they exist (strict builds fail on missing
# pages, and the docs describe only what is built). Planned sections:
# life-of-a-run, abstractions, security, runbooks/,
# onboarding-a-backend, bringing-up-a-site, physics-notes, open-questions.
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Client contract: contract.md
  - Components:
      - Repository layout: components/repo-layout.md
      - Client patch: components/client-patch.md
      - Cilium: components/cilium.md
      - Argo CD: components/argocd.md
      - cert-manager: components/cert-manager.md
      - chronon-api: components/api.md
      - chronon-state: components/state.md
      - Postgres: components/postgres.md
      - Valkey: components/valkey.md
      - sim-qpu device: components/sim-qpu.md
      - Rehearsal and overhead: components/rehearsal.md
  - Decisions (ADRs):
      - 0004 Warm worker vs pod per run: adr/0004-warm-worker-vs-pod-per-run.md
      - 0005 Fair scheduling: adr/0005-fair-scheduling.md
      - 0002 GitOps topology: adr/0002-gitops-topology.md
      - 0003 No secrets in git: adr/0003-no-secrets-in-git.md
      - 0006 Gateway host network: adr/0006-gateway-host-network.md
      - 0007 Local CA: adr/0007-local-ca.md
      - 0008 Valkey: adr/0008-valkey.md
      - 0009 Postgres on CNPG: adr/0009-postgres-cnpg-jsonb.md
      - 0012 Token semantics: adr/0012-token-semantics.md
  - Built with Claude Code: built-with-claude-code.md
  - Build log: build-log.md
